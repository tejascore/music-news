<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEWS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e2a5a;--panel:#f4f4ff;--edge:#0d1030;--pink:#ff4f7b;--mint:#5ef2c0;--sun:#ffd23f;--ink:#0d1030;--soft:#4b4f7a}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"VT323","Courier New",monospace;font-size:22px;line-height:1.15;background-color:var(--bg);overflow-x:hidden}
body.locked{overflow:hidden}

/* twinkling pixel stars */
.stars{position:fixed;top:20px;left:20px;width:4px;height:4px;background:#fff;pointer-events:none;opacity:.55;
 box-shadow:120px 60px #fff,300px 140px #ffd23f,520px 40px #fff,760px 180px #5ef2c0,980px 80px #fff,1200px 150px #ffd23f,1500px 60px #fff,1750px 190px #5ef2c0,
 200px 400px #fff,640px 520px #5ef2c0,1100px 460px #fff,1400px 380px #ffd23f,1700px 540px #fff,420px 640px #ffd23f,900px 700px #fff,1300px 720px #5ef2c0;
 animation:tw 1.6s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}

main{position:relative;max-width:820px;margin:0 auto;padding:24px 14px 60px}
header{display:flex;gap:18px;align-items:center;margin-bottom:22px;color:#fff}
canvas{image-rendering:pixelated;width:96px;height:80px;flex:none;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font:normal 30px/1.4 "Press Start 2P",monospace;margin:0;color:var(--sun);text-shadow:4px 4px 0 var(--edge);letter-spacing:4px}
.tag{margin:8px 0 0;color:var(--mint)}
.box{background:var(--panel);border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);padding:14px 16px;margin-bottom:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input{flex:1 1 200px;font:inherit;padding:6px 10px;border:4px solid var(--edge);background:#fff}
button{font:normal 11px/1.4 "Press Start 2P",monospace;padding:10px 12px;border:4px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--edge)}
button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--edge)}
button:active{transform:translate(4px,4px);box-shadow:none}
button[aria-pressed="true"]{background:var(--pink);color:#fff}
.go{background:var(--mint)}
:focus-visible{outline:4px dashed var(--sun);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.status{font:normal 11px/1.8 "Press Start 2P",monospace;color:#fff;margin:0 0 18px}
.status.err{background:var(--pink);border:4px solid var(--edge);padding:12px;line-height:2}
.card h2{font:normal 13px/1.7 "Press Start 2P",monospace;margin:0 0 8px}
.card a{color:var(--ink);text-decoration:none;background:linear-gradient(var(--sun),var(--sun)) 0 100%/0 6px no-repeat}
.card a:hover,.card a:focus-visible{background-size:100% 6px}
.card p{margin:0 0 10px;color:var(--soft)}
.card{transition:transform .15s steps(3)}
.card:hover{transform:translate(-4px,-4px) rotate(-.4deg)}
.meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.src{background:var(--edge);color:var(--mint);padding:2px 8px}
.bar{display:flex;gap:3px}.bar i{width:10px;height:14px;background:#c9cbe8;display:block}.bar i.on{background:var(--pink)}
.cur::after{content:"_";animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}

/* cards pop in after the landing opens */
main:not(.show) .box{opacity:0}
main.show header,main.show .tools-box{animation:pop .5s steps(6) backwards}
main.show .card{animation:pop .5s steps(6) backwards;animation-delay:calc(var(--i,0) * 70ms + 200ms)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}}

/* ===== landing page ===== */
#intro{position:fixed;inset:0;z-index:100;cursor:pointer}
.half{position:absolute;inset:0;background-color:var(--bg);
 background-image:linear-gradient(#ffffff12 2px,transparent 2px),linear-gradient(90deg,#ffffff12 2px,transparent 2px);background-size:32px 32px;
 transition:transform .9s steps(9) .35s}
.half.l{clip-path:polygon(0 0,52% 0,48% 6%,54% 12%,47% 18%,53% 24%,48% 30%,54% 36%,47% 42%,53% 48%,48% 54%,54% 60%,47% 66%,53% 72%,48% 78%,54% 84%,47% 90%,53% 96%,50% 100%,0 100%)}
.half.r{clip-path:polygon(52% 0,100% 0,100% 100%,50% 100%,53% 96%,47% 90%,54% 84%,48% 78%,53% 72%,47% 66%,54% 60%,48% 54%,53% 48%,47% 42%,54% 36%,48% 30%,53% 24%,47% 18%,54% 12%,48% 6%)}
.opening .half.l{transform:translateX(-65%) rotate(-5deg)}
.opening .half.r{transform:translateX(65%) rotate(5deg)}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.opening .ui{animation:out .45s steps(5) forwards}
@keyframes out{to{transform:scale(1.6) rotate(8deg);opacity:0}}
.stack{position:relative;width:230px;height:270px;animation:bob 1.2s steps(2) infinite}
.sheet{position:absolute;inset:0;background:var(--panel);border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);
 background-image:repeating-linear-gradient(#0d103033 0 4px,transparent 4px 12px);background-position:0 120px;background-size:100% 130px;background-repeat:no-repeat}
.sheet:nth-child(1){transform:rotate(-9deg);background-color:var(--mint)}
.sheet:nth-child(2){transform:rotate(6deg);background-color:var(--sun)}
.sheet:nth-child(3){transform:rotate(-1deg)}
.sheet h2{font:normal 34px/1 "Press Start 2P",monospace;margin:18px 0 0;text-align:center;letter-spacing:2px}
.pic{width:110px;height:70px;margin:16px auto 0;background:var(--pink);border:4px solid var(--edge);box-shadow:inset -12px -12px 0 #c93560}
#open{font-size:14px;padding:16px 20px;background:var(--pink);color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--sun);color:var(--ink)}}
#burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.paper{position:absolute;left:50%;top:50%;translate:-50% -50%;border:3px solid var(--edge);
 background-image:repeating-linear-gradient(#0d103044 0 3px,transparent 3px 9px);animation:fly 1.2s steps(16) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.5);opacity:0}}

@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
}
@media (max-width:520px){h1{font-size:20px}canvas{width:72px;height:60px}}
</style>
</head>
<body class="locked">
<div class="stars"></div>

<div id="intro">
  <div class="half l"></div>
  <div class="half r"></div>
  <div class="ui">
    <div class="stack" aria-hidden="true">
      <div class="sheet"></div><div class="sheet"></div>
      <div class="sheet"><h2>NEWS</h2><div class="pic"></div></div>
    </div>
    <button id="open" type="button">Press to open</button>
  </div>
  <div id="burst"></div>
</div>

<main id="app">
  <header>
    <canvas id="spr" width="12" height="10" aria-hidden="true"></canvas>
    <div><h1>NEWS</h1><p class="tag cur">Fresh music news, live from your feeds</p></div>
  </header>

  <div class="box tools-box">
    <div class="tools">
      <input id="q" type="search" placeholder="Search stories" aria-label="Search stories">
      <button id="go" class="go" type="button">Refresh</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by source"></div>
  </div>

  <p class="status" id="status" role="status"></p>
  <div id="list"></div>
</main>

<script>
// Your n8n production webhook URL (the workflow must be published).
const WEBHOOK_URL = 'http://localhost:5678/webhook/music-news';

const $ = id => document.getElementById(id);
let stories = [], source = 'All', opened = false;

// ----- landing: click to tear the page open -----
function burst(){
  const box = $('burst'), cols = ['#f4f4ff','#f4f4ff','#ffd23f','#ff4f7b','#5ef2c0'];
  for (let i = 0; i < 36; i++){
    const p = document.createElement('div'); p.className = 'paper';
    const a = Math.random() * Math.PI * 2, d = 250 + Math.random() * 750;
    p.style.cssText = '--dx:' + (Math.cos(a) * d) + 'px;--dy:' + (Math.sin(a) * d) + 'px;--r:' + ((Math.random() * 1440 - 720) | 0) + 'deg;' +
      'width:' + (30 + Math.random() * 60 | 0) + 'px;height:' + (40 + Math.random() * 70 | 0) + 'px;' +
      'background-color:' + cols[i % cols.length] + ';animation-delay:' + (Math.random() * 120 | 0) + 'ms';
    box.appendChild(p);
  }
}
function openSite(){
  if (opened) return; opened = true;
  const intro = $('intro'), app = $('app');
  if (matchMedia('(prefers-reduced-motion:reduce)').matches){
    intro.remove(); document.body.classList.remove('locked'); app.classList.add('show'); return;
  }
  intro.classList.add('opening'); intro.style.pointerEvents = 'none';
  burst();
  setTimeout(() => app.classList.add('show'), 450);
  setTimeout(() => { intro.remove(); document.body.classList.remove('locked'); }, 1700);
}
$('intro').addEventListener('click', openSite);

// ----- pixel headphones sprite -----
(function(){
  const rows = ['..yyyyyyyy..','.yy......yy.','y..........y','y..........y','yy........yy',
                'ppp......ppp','pwp......pwp','pwp......pwp','pwp......pwp','ppp......ppp'];
  const col = {y:'#ffd23f',p:'#ff4f7b',w:'#ffffff'};
  const c = $('spr').getContext('2d');
  rows.forEach((r, y) => [...r].forEach((k, x) => { if (col[k]) { c.fillStyle = col[k]; c.fillRect(x, y, 1, 1); } }));
})();

function hoursOld(iso){ return Math.max(0, (Date.now() - new Date(iso)) / 3600e3); }
function ago(iso){
  const m = Math.max(1, Math.round(hoursOld(iso) * 60));
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' days ago';
}
function safeLink(u){ try { const p = new URL(u).protocol; return (p === 'http:' || p === 'https:') ? u : '#'; } catch(e){ return '#'; } }

function setStatus(msg, err){
  const s = $('status'); s.textContent = msg || ''; s.className = 'status' + (err ? ' err' : '');
  s.hidden = !msg;
}

function drawChips(){
  const c = $('chips'); c.textContent = '';
  ['All', ...new Set(stories.map(s => s.source))].forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = n; b.setAttribute('aria-pressed', String(n === source));
    b.onclick = () => { source = n; drawChips(); drawList(); };
    c.appendChild(b);
  });
}

function drawList(){
  const q = $('q').value.trim().toLowerCase();
  const out = stories.filter(s => (source === 'All' || s.source === source) &&
    (!q || (s.title + ' ' + s.contentSnippet).toLowerCase().includes(q)));
  const list = $('list'); list.textContent = '';
  if (!out.length && stories.length){ setStatus('No stories match. Clear the search or pick another source.'); return; }
  if (stories.length) setStatus(out.length + ' stories loaded');
  out.forEach((s, idx) => {
    const d = document.createElement('article'); d.className = 'box card'; d.style.setProperty('--i', Math.min(idx, 10));
    const h = document.createElement('h2'), a = document.createElement('a');
    a.href = safeLink(s.link); a.target = '_blank'; a.rel = 'noopener'; a.textContent = s.title;
    h.appendChild(a);
    const p = document.createElement('p'); p.textContent = s.contentSnippet;
    const m = document.createElement('div'); m.className = 'meta';
    const src = document.createElement('span'); src.className = 'src'; src.textContent = s.source;
    const t = document.createElement('span'); t.textContent = ago(s.pubDate);
    const bar = document.createElement('div'); bar.className = 'bar'; bar.title = 'Freshness';
    const fill = Math.max(1, 8 - Math.floor(hoursOld(s.pubDate) / 3));
    for (let i = 0; i < 8; i++){ const x = document.createElement('i'); if (i < fill) x.className = 'on'; bar.appendChild(x); }
    m.append(src, t, bar); d.append(h, p, m); list.appendChild(d);
  });
}

async function load(){
  setStatus('Loading stories...');
  try {
    const r = await fetch(WEBHOOK_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    stories = (Array.isArray(data) ? data : [data]).filter(x => x && x.title).map(x => ({
      title: String(x.title), link: String(x.link || '#'), contentSnippet: String(x.contentSnippet || ''),
      pubDate: x.pubDate || new Date().toISOString(), source: String(x.source || 'news')
    })).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    if (!stories.length) { setStatus('The webhook worked but sent no stories.', true); }
    drawChips(); drawList();
  } catch (e){
    stories = []; $('list').textContent = ''; drawChips();
    setStatus('Cannot load news. Check: 1) n8n is running, 2) the workflow is published, 3) the URL is right, 4) CORS allows all origins on the Webhook node.', true);
  }
}

$('q').addEventListener('input', drawList);
$('go').onclick = load;
setInterval(load, 10 * 60 * 1000);
load();
</script>
</body>
</html>
